[package]
name = "mln-rs-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
# style.json, which the scene embeds.
include = ["/src", "/style.json"]
# The benchmarks (README.md); never released.
publish = false

[lib]
name = "mln_bench"
doctest = false

[[bin]]
name = "mln-bench"
path = "src/main.rs"
test = false

[dependencies]
libc.workspace = true
mln_actor.workspace = true
mln_gfx.workspace = true
mln_headless.workspace = true
mln_image.workspace = true
mln_map.workspace = true
# Its `sqlite` feature (the ambient cache, as on native) comes through
# render_test: naming it here would stop `mln-bench compare` building this
# harness over commits from before mln_storage had the feature.
mln_storage.workspace = true
mln_text.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true
pixelmatch.workspace = true
render_test.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[lints]
workspace = true
