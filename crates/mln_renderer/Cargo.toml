[package]
name = "mln-rs-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_renderer"
# The doc comments have no examples to run.
doctest = false

[features]
default = ["font-face-shaper"]
# The style's font faces shaped in-process with mln_text's HBShaper
# (HarfRust), the default FontFaceEngine (src/text/font_face_engine.rs). The
# workspace's packages depend on this crate without its default features,
# and those that render (mln-rs, examples/glfw, tools/render-test, and
# through it tools/bench) turn this one on. The browser build (examples/web)
# leaves it off: HarfRust, skrifa and the FreeType port go into its second
# module, crates/mln_web_shaper, which its map loads only for styles with font
# faces.
font-face-shaper = []

[dependencies]
bytemuck.workspace = true
earcut.workspace = true
feature.workspace = true
geometry.workspace = true
libstdcxx.workspace = true
mln_actor.workspace = true
mln_expression.workspace = true
mln_gfx.workspace = true
mln_image.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
nunicode.workspace = true
polylabel.workspace = true
postcard.workspace = true
serde.workspace = true
shelf_pack.workspace = true

# test/util/tile_cover.test.cpp: needs mln_map's Transform, which is above
# this crate, so it is an integration test rather than a unit test.
[[test]]
name = "tile_cover_test"
path = "tests/tile_cover_test.rs"

# test/tile/geojson_tile.test.cpp and the GeoJSON parts of
# test/style/source.test.cpp: need mln_map's Transform (above this crate).
[[test]]
name = "geojson_tile_test"
path = "tests/geojson_tile_test.rs"

[[test]]
name = "source_test"
path = "tests/source_test.rs"

# Ports test/gl/bucket.test.cpp (circle, fill, line; on the WebGPU headless
# backend) and test/renderer/fill_bucket.test.cpp.
[[test]]
name = "bucket_test"
path = "tests/bucket_test.rs"

# Ports test/layout/sort_key.test.cpp.
[[test]]
name = "sort_key_test"
path = "tests/sort_key_test.rs"

# The VectorTile tests of test/tile/vector_tile.test.cpp.
[[test]]
name = "vector_tile_test"
path = "tests/vector_tile_test.rs"

# gtests-data: the test/tile gtests that need the renderer's tiles or
# mln_map's Transform (tests/tile/main.rs lists them).
[[test]]
name = "tile_test"
path = "tests/tile/main.rs"

# gtests-data: the test/text gtests that need mln_renderer (GlyphManager,
# SymbolLayout) or mln_expression's Formatted (tests/text/main.rs lists them).
[[test]]
name = "text_test"
path = "tests/text/main.rs"

# gtests-data: test/gl/*.test.cpp except bucket.test.cpp, which are
# OpenGL-backend-only (all ignored with that reason).
[[test]]
name = "gl_test"
path = "tests/gl/main.rs"

# gtests-core: test/algorithm/update_renderables.test.cpp.
[[test]]
name = "gtest_update_renderables"
path = "tests/gtest_update_renderables.rs"

# gtests-core: test/geometry/line_atlas.test.cpp.
[[test]]
name = "gtest_line_atlas"
path = "tests/gtest_line_atlas.rs"

# gtests-core: test/renderer/image_manager.test.cpp.
[[test]]
name = "gtest_image_manager"
path = "tests/gtest_image_manager.rs"

# gtests-core: test/renderer/pattern_atlas.test.cpp.
[[test]]
name = "gtest_pattern_atlas"
path = "tests/gtest_pattern_atlas.rs"

# gtests-core: test/renderer/style_diff.test.cpp.
[[test]]
name = "gtest_style_diff"
path = "tests/gtest_style_diff.rs"

# gtests-core: test/renderer/dynamic_texture_atlas.test.cpp.
[[test]]
name = "gtest_dynamic_texture_atlas"
path = "tests/gtest_dynamic_texture_atlas.rs"

# Port-only: malformed vector tiles become tile errors, not panics.
[[test]]
name = "malformed_tile_test"
path = "tests/malformed_tile_test.rs"

# Ports test/util/tile_range.test.cpp (marker `// gtest: Group.Name`).
[[test]]
name = "gtest_tile_range"
path = "tests/gtest_tile_range.rs"

[dev-dependencies]
geojson = { package = "mln-rs-geojson", path = "../../vendor/geojson" }
mln_conversion = { package = "mln-rs-conversion", path = "../mln_conversion" }
mln_map = { package = "mln-rs-map", path = "../mln_map" }
mln_sprite = { package = "mln-rs-sprite", path = "../mln_sprite" }
mln_webgpu = { package = "mln-rs-webgpu", path = "../mln_webgpu" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
