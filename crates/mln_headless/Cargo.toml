[package]
name = "mln-rs-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# The [[test]]s below; tests/ also holds their modules.
autotests = false

[lib]
name = "mln_headless"
# The doc comments have no examples to run.
doctest = false

[dependencies]
mln_actor.workspace = true
mln_gfx.workspace = true
mln_map.workspace = true
mln_renderer.workspace = true
mln_storage.workspace = true
mln_style.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true

# The M1 background render tests through Map -> HeadlessFrontend, without the
# render-test runner (see the file comment).
[[test]]
name = "m1_background_render_test"
path = "tests/m1_background_render_test.rs"

# gtests-data: test/text/local_glyph_rasterizer.test.cpp (renders a map
# through HeadlessFrontend with a StubFileSource).
[[test]]
name = "local_glyph_rasterizer_test"
path = "tests/local_glyph_rasterizer_test.rs"

# gtests-core: test/renderer/feature_tracking.test.cpp (all ignored until
# rendered-feature tracking is ported; see the file comment).
[[test]]
name = "gtest_feature_tracking"
path = "tests/gtest_feature_tracking.rs"

# gtests-core: test/map/{map,prefetch,map_snapshotter}.test.cpp through Map
# (over a StubFileSource/FakeFileSource) -> HeadlessFrontend. Shared fixture
# in tests/support/mod.rs.
[[test]]
name = "gtest_map"
path = "tests/gtest_map.rs"

# gtests-core: test/api/{annotations,api_misuse,custom_geometry_source,
# custom_layer,query}.test.cpp and test/api/recycle_map.cpp. Shared fixture
# in tests/support/mod.rs.
[[test]]
name = "gtest_api"
path = "tests/gtest_api.rs"

# gtests-core: test/util/memory.test.cpp (Map over a StubFileSource with the
# test/fixtures/resources styles). Shared fixture in tests/support/mod.rs.
[[test]]
name = "gtest_memory"
path = "tests/gtest_memory.rs"

[dev-dependencies]
# gtest_map's MainResourceLoader and Database file source tests.
feature = { package = "mln-rs-feature", path = "../../vendor/feature" }
geojson = { package = "mln-rs-geojson", path = "../../vendor/geojson" }
mln_image = { package = "mln-rs-image", path = "../mln_image" }
mln_map_types = { package = "mln-rs-map-types", path = "../mln_map_types" }
mln_math = { package = "mln-rs-math", path = "../mln_math" }
mln_storage = { workspace = true, features = ["sqlite"] }
mln_test_server = { package = "mln-rs-test-server", path = "../../tools/test-server" }
mln_text = { package = "mln-rs-text", path = "../mln_text" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "../../vendor/pixelmatch" }
serde_json.workspace = true

[lints]
workspace = true
