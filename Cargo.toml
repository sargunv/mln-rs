# The port and its crates.io release (RELEASING.md). Each library under
# crates/ and vendor/ is the package mln-rs-<name> (library name unchanged,
# so the code still says `mln_util::`), and the package here, mln-rs,
# re-exports them all. Users depend on mln-rs only. The differential tests
# against the C++ core (louwers/mln-rs-difftests) test the released crates.
[workspace]
resolver = "3"
# The packages with `publish = false` are test helpers or unused by mln-rs.
members = [
    "crates/*",
    "examples/*",
    "tools/bench",
    "tools/expression-test",
    "tools/render-test",
    "tools/style-codegen",
    "tools/test-server",
    "vendor/*",
    "vendor/earcut/test_fixtures",
]

[workspace.package]
# Every package is published at this version. To release, bump it here and
# in the in-repo [workspace.dependencies] below (RELEASING.md).
version = "0.0.10"
edition = "2024"
# The oldest Rust the packages build with (mlt-core 0.22 needs 1.98). CI's
# msrv job builds the workspace with it.
rust-version = "1.98"
description = "Part of mln-rs, a Rust port of the MapLibre Native map rendering core. Depend on mln-rs instead."
license = "BSD-2-Clause"
repository = "https://github.com/louwers/mln-rs"
include = ["/src", "/tests"]

[workspace.dependencies]
# In-repo libraries. The exact version keeps a release's packages together.
cheap_ruler = { package = "mln-rs-cheap-ruler", path = "vendor/cheap-ruler", version = "=0.0.10" }
csscolorparser = { package = "mln-rs-csscolorparser", path = "vendor/csscolorparser", version = "=0.0.10" }
earcut = { package = "mln-rs-earcut", path = "vendor/earcut", version = "=0.0.10" }
earcut_test_fixtures = { package = "mln-rs-earcut-test-fixtures", path = "vendor/earcut/test_fixtures", version = "=0.0.10" }
feature = { package = "mln-rs-feature", path = "vendor/feature", version = "=0.0.10" }
geojson = { package = "mln-rs-geojson", path = "vendor/geojson", version = "=0.0.10" }
geojson_vt = { package = "mln-rs-geojson-vt", path = "vendor/geojson-vt", version = "=0.0.10" }
geometry = { package = "mln-rs-geometry", path = "vendor/geometry", version = "=0.0.10" }
kdbush = { package = "mln-rs-kdbush", path = "vendor/kdbush", version = "=0.0.10" }
libstdcxx = { package = "mln-rs-libstdcxx", path = "vendor/libstdcxx", version = "=0.0.10" }
mln_actor = { package = "mln-rs-actor", path = "crates/mln_actor", version = "=0.0.10" }
mln_conversion = { package = "mln-rs-conversion", path = "crates/mln_conversion", version = "=0.0.10" }
mln_expression = { package = "mln-rs-expression", path = "crates/mln_expression", version = "=0.0.10" }
mln_gestures = { package = "mln-rs-gestures", path = "crates/mln_gestures", version = "=0.0.10" }
mln_gfx = { package = "mln-rs-gfx", path = "crates/mln_gfx", version = "=0.0.10" }
mln_headless = { package = "mln-rs-headless", path = "crates/mln_headless", version = "=0.0.10" }
mln_image = { package = "mln-rs-image", path = "crates/mln_image", version = "=0.0.10" }
mln_map = { package = "mln-rs-map", path = "crates/mln_map", version = "=0.0.10" }
mln_map_types = { package = "mln-rs-map-types", path = "crates/mln_map_types", version = "=0.0.10" }
mln_math = { package = "mln-rs-math", path = "crates/mln_math", version = "=0.0.10" }
# Without its default feature, the in-process font-face shaper: the packages
# that render turn it on (crates/mln_renderer/Cargo.toml).
mln_renderer = { package = "mln-rs-renderer", path = "crates/mln_renderer", version = "=0.0.10", default-features = false }
mln_sprite = { package = "mln-rs-sprite", path = "crates/mln_sprite", version = "=0.0.10" }
# Without SQLite (its `sqlite` feature) unless a package asks for it, so
# that examples/web leaves it out.
mln_storage = { package = "mln-rs-storage", path = "crates/mln_storage", version = "=0.0.10", default-features = false }
mln_storage_offline = { package = "mln-rs-storage-offline", path = "crates/mln_storage_offline", version = "=0.0.10" }
mln_style = { package = "mln-rs-style", path = "crates/mln_style", version = "=0.0.10" }
mln_style_types = { package = "mln-rs-style-types", path = "crates/mln_style_types", version = "=0.0.10" }
mln_text = { package = "mln-rs-text", path = "crates/mln_text", version = "=0.0.10" }
mln_tile = { package = "mln-rs-tile", path = "crates/mln_tile", version = "=0.0.10" }
mln_tile_id = { package = "mln-rs-tile-id", path = "crates/mln_tile_id", version = "=0.0.10" }
mln_util = { package = "mln-rs-util", path = "crates/mln_util", version = "=0.0.10" }
mln_vec_map = { package = "mln-rs-vec-map", path = "crates/mln_vec_map", version = "=0.0.10" }
mln_webgpu = { package = "mln-rs-webgpu", path = "crates/mln_webgpu", version = "=0.0.10" }
nunicode = { package = "mln-rs-nunicode", path = "vendor/nunicode", version = "=0.0.10" }
pixelmatch = { package = "mln-rs-pixelmatch", path = "vendor/pixelmatch", version = "=0.0.10" }
pmtiles = { package = "mln-rs-pmtiles", path = "vendor/pmtiles", version = "=0.0.10" }
polylabel = { package = "mln-rs-polylabel", path = "vendor/polylabel", version = "=0.0.10" }
protozero = { package = "mln-rs-protozero", path = "vendor/protozero", version = "=0.0.10" }
rapidjson = { package = "mln-rs-rapidjson", path = "vendor/rapidjson", version = "=0.0.10" }
render_test = { package = "mln-rs-render-test", path = "tools/render-test", version = "=0.0.10" }
shelf_pack = { package = "mln-rs-shelf-pack", path = "vendor/shelf-pack", version = "=0.0.10" }
style_codegen = { package = "mln-rs-style-codegen", path = "tools/style-codegen", version = "=0.0.10" }
supercluster = { package = "mln-rs-supercluster", path = "vendor/supercluster", version = "=0.0.10" }
vector_tile = { package = "mln-rs-vector-tile", path = "vendor/vector-tile", version = "=0.0.10" }
wagyu = { package = "mln-rs-wagyu", path = "vendor/wagyu", version = "=0.0.10" }

# Third-party crates, for both builds (Cargo.lock pins their versions). Only
# add a crate when nothing in the C++ core has to be ported for it.
#
# min_const_generics: Pod for any array length (mln_gfx's UBOs).
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
# Evaluated as a replacement for vendor/earcut and rejected: on polygons with
# holes it differs from the C++ earcut.hpp (25% identical, 1.1% cover a
# different area; see difftest/earcut_crate). Only that comparison uses it, so
# a newer release can be re-checked.
earcut_crate = { package = "earcut", version = "0.4.5" }
# zlib backend (libz-sys) instead of miniz_oxide: util::compress output must
# be byte-identical to the zlib the C++ links (offline database stored sizes
# and ambient-cache accounting; OfflineDatabase.PutReturnsSize).
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
# examples/glfw: links the system GLFW (dynamic-link) instead of downloading
# prebuilt libraries in a build script; raw window handles give wgpu its
# surface.
glfw = { version = "0.63.0", default-features = false, features = ["dynamic-link", "raw-window-handle-v0-6", "wayland", "x11"] }
# examples/glfw: finds the system fonts it gives the map as fallback font
# faces, and maps their files instead of reading them.
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
harfrust = { version = "0.15.0" }
# The HTTP test server of the tests (tools/test-server).
httpmock = { version = "0.9.0", default-features = false }
# decodeWEBP (platform/default/src/mln/util/webp_reader.cpp); pure Rust.
image-webp = { version = "0.2.4" }
# tools/bench: the process's CPU time (clock_gettime), which std lacks.
libc = { version = "0.2.191" }
# MLT decoding: the Rust implementation of the MapLibre Tile spec, instead of
# porting the C++ decoder (vendor/maplibre-tile-spec/cpp). Assumed correct
# (user decision, 2026-11-04); the differential test against the C++ decoder
# (//difftest/mlt) was removed with that decision.
mlt-core = { version = "0.22.1" }
png = { version = "0.18.1" }
pollster = { version = "1.0.1" }
# The messages between a tile and its worker in another wasm instance
# (mln_renderer's tile/worker_codec), and the tests of the types they carry:
# a compact serde format.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The difftests' property tests.
proptest = { version = "1.12.0" }
regex = { version = "1.13.1" }
# tools/render-test's JSON (with serde_json), and the types that cross to a
# tile worker in another wasm instance (rc: the values behind their `Arc`s).
serde = { version = "1.0.229", features = ["derive", "rc"] }
# The same engine as the C++ core's vendored SQLite, built from source like it.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# preserve_order: rapidjson iterates object members in document order, and
# the C++ relies on that (style parser, expression error order).
# float_roundtrip: correctly rounded float parsing, like rapidjson's full
# precision parse (the default parser can be off by an ULP).
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
skrifa = { version = "0.49.0" }
# Candidate for ICU's ubidi (platform/default/src/mln/text/bidi.cpp); kept only
# if //difftest/shaping shows it matches ICU on the test corpus.
unicode-bidi = { version = "0.3.18" }
# HTTP for the online file source (the C++ default platform uses curl).
ureq = { version = "3.5.1" }
# examples/web: the browser's API through wasm-bindgen (whose CLI must be
# this exact version).
js-sys = { version = "0.3.107" }
wasm-bindgen = { version = "=0.2.130" }
wasm-bindgen-futures = { version = "0.4.80" }
web-sys = { version = "0.3.107", features = [
    "Blob", "Headers", "ImageBitmap", "ImageData", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "Request",
    "RequestInit", "Response", "TextMetrics", "console",
] }
# std::time's clocks, which panic on wasm32-unknown-unknown (mln_util::time):
# performance.now() and Date.now() there, std::time everywhere else.
web-time = { version = "1.1.0" }
# Ports the C++ WebGPU backend (src/mln/webgpu, which runs on Dawn or
# wgpu-native) onto the Rust implementation of the same API: Vulkan, Metal
# and DX12 natively (wgpu builds each only where it runs), and on
# wasm32-unknown-unknown the browser's WebGPU (examples/web). Not its
# default GLES backend, which nothing selects.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "webgpu"] }

# Lints for every package (`[lints] workspace = true`): clippy's default set,
# with warnings denied in CI (the `lint` job), except the lints whose fix
# would make the port read or behave less like the C++ it mirrors.
[workspace.lints.rust]
# No `unsafe` outside FFI. The FFI modules allow it.
unsafe_code = "deny"

[workspace.lints.clippy]
# The C++ code's shape: nested ifs, index loops, `x >= a && x <= b`,
# `x % n == 0`, `if c > 0 { a / c }`, `i * 4 + 0`, a value
# default-constructed and then set, a variable declared and then assigned in
# each branch, branches that do the same thing.
collapsible_if = "allow"
field_reassign_with_default = "allow"
identity_op = "allow"
if_same_then_else = "allow"
manual_checked_ops = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
needless_late_init = "allow"
needless_range_loop = "allow"
# The C++ names and signatures: enumerators, methods named like std trait
# methods (`add`, `next`), `toString()`, files named like their module,
# factories, constructors, long parameter lists and nested template types.
enum_variant_names = "allow"
inherent_to_string = "allow"
module_inception = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# Readability over a saved clone or bounds check: the expression signature
# tables list types as `&[n.clone()]` (C++'s `{n}`), and the pixel loops
# step with `chunks_exact(4)`.
chunks_exact_to_as_chunks = "allow"
cloned_ref_to_slice_refs = "allow"
# The C++ float behaviour: literals with all their digits, `!(a < b)` that
# holds for NaN, and std::min/std::max where `clamp` would panic on NaN or
# reversed bounds.
excessive_precision = "allow"
manual_clamp = "allow"
neg_cmp_op_on_partial_ord = "allow"

[package]
name = "mln-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Rust port of the MapLibre Native map rendering core"
license.workspace = true
repository.workspace = true
include = ["/src", "/LICENSE.md"]
keywords = ["maplibre", "map", "vector-tiles", "gis", "rendering"]
categories = ["graphics", "rendering::engine", "science::geo"]

[dependencies]
csscolorparser.workspace = true
earcut.workspace = true
feature.workspace = true
geojson.workspace = true
geojson_vt.workspace = true
geometry.workspace = true
kdbush.workspace = true
libstdcxx.workspace = true
mln_actor.workspace = true
mln_conversion.workspace = true
mln_expression.workspace = true
mln_gestures.workspace = true
mln_gfx.workspace = true
mln_headless.workspace = true
mln_image.workspace = true
mln_map.workspace = true
mln_map_types.workspace = true
mln_math.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
mln_sprite.workspace = true
# The ambient cache, offline regions and mbtiles:// sources, as in C++.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_storage_offline.workspace = true
mln_style.workspace = true
mln_style_types.workspace = true
mln_text.workspace = true
mln_tile.workspace = true
mln_tile_id.workspace = true
mln_util.workspace = true
mln_vec_map.workspace = true
mln_webgpu.workspace = true
nunicode.workspace = true
pmtiles.workspace = true
polylabel.workspace = true
protozero.workspace = true
rapidjson.workspace = true
shelf_pack.workspace = true
supercluster.workspace = true
vector_tile.workspace = true
wagyu.workspace = true

[lints]
workspace = true

# Fat LTO with one codegen unit: smaller release binaries, for a longer
# build. The browser build adds opt-level "s" (`just web`).
[profile.release]
lto = "fat"
codegen-units = 1
