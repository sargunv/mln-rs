[package]
name = "mln-rs-glfw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true
# Ports platform/glfw (the GLFW example app) on the WebGPU backend; never
# released. It links the system GLFW (`glfw` in Cargo.toml).
publish = false
autotests = false

[lib]
name = "mln_glfw"

# The app: OpenFreeMap Liberty in a window (main.cpp). `just glfw`.
[[bin]]
name = "mln-glfw"
path = "src/main.rs"
doc = false

# Opens a window, clears its wgpu surface through the gfx path, reads the
# presented frame back and checks it. Needs a display (Wayland or X11).
[[bin]]
name = "glfw_surface_smoke"
path = "tools/surface_smoke.rs"
doc = false

[dependencies]
feature.workspace = true
fontdb.workspace = true
glfw.workspace = true
mln_actor.workspace = true
mln_gestures.workspace = true
mln_gfx.workspace = true
mln_image.workspace = true
mln_map.workspace = true
mln_math.workspace = true
mln_renderer = { workspace = true, features = ["font-face-shaper"] }
# The ambient cache and mbtiles:// sources, as in C++.
mln_storage = { workspace = true, features = ["sqlite"] }
mln_style.workspace = true
mln_text.workspace = true
mln_util.workspace = true
mln_webgpu.workspace = true
serde_json.workspace = true
skrifa.workspace = true
wgpu.workspace = true

# Loads the OpenFreeMap Liberty style over HTTPS through the Map's file
# sources (OnlineFileSource -> HTTPFileSource) and Style::loadURL, and parses
# it. Needs network access, so it is ignored by default: `cargo test -p
# mln-rs-glfw -- --ignored`.
[[test]]
name = "liberty_style_test"
path = "tests/liberty_style_test.rs"

# Finds and maps the system fonts the app gives the map as fallback font
# faces, and lists them: `cargo test -p mln-rs-glfw --test system_fonts_test
# -- --nocapture`.
[[test]]
name = "system_fonts_test"
path = "tests/system_fonts_test.rs"

[lints]
workspace = true
